name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Version or Publish
    runs-on: ubuntu-latest

    permissions:
      contents: write       # crear commits y tags
      pull-requests: write  # abrir/actualizar el PR de versiones
      id-token: write       # npm provenance

    steps:
      - uses: actions/checkout@v4
        with:
          # Necesario para que changeset pueda leer todo el historial
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Create Version PR or Publish
        uses: changesets/action@v1
        with:
          # Script que changeset invoca al publicar (después de bumps)
          publish: npm run release
          # Mensaje del commit que actualiza versiones
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
